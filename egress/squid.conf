# Egress proxy for web-mcp's fetch_page (second, independent guard).
# The web-mcp container has no direct internet; its only way out is this
# proxy, which resolves DNS itself and refuses private/local destinations.

http_port 3128

# --- What is allowed ----------------------------------------------------------
acl web_ports port 80 443
acl CONNECT method CONNECT

# Destinations that must never be reached (checked on the RESOLVED address,
# so a public-looking hostname that resolves to a private IP is refused too).
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl blocked_dst dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24
acl blocked_dst dst 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24
acl blocked_dst dst 224.0.0.0/4 240.0.0.0/4
# IPv6. Deliberately NOT listing ::/96 or ::ffff:0:0/96: squid stores IPv4
# addresses in IPv4-mapped form, so those would match every IPv4 destination.
# The IPv4 rules above already cover mapped addresses.
acl blocked_dst dst ::/128 ::1 64:ff9b::/96 2002::/16 2001::/32 2001:db8::/32 100::/64
acl blocked_dst dst fc00::/7 fe80::/10 fec0::/10 ff00::/8

# Local-looking names are refused before any DNS lookup, including any
# single-label name such as "searxng", "egress" or "router".
acl blocked_names dstdomain .localhost .local .internal .home.arpa .ts.net .lan .intranet .localdomain
acl single_label dstdom_regex -i ^[a-z0-9_-]+$

# Only clients on the websearch-internal network (created with this exact
# subnet, see README) may use the proxy. Other containers and the host are refused.
acl clients src 172.30.99.0/24

# --- Access rules (first match wins) ------------------------------------------
http_access deny !clients
http_access deny !CONNECT
http_access deny !web_ports
http_access deny blocked_names
http_access deny single_label
http_access deny blocked_dst
http_access allow CONNECT web_ports
http_access deny all

# --- Hardening ----------------------------------------------------------------
cache deny all
forwarded_for delete
via off
httpd_suppress_version_string on
visible_hostname egress
connect_timeout 10 seconds
read_timeout 30 seconds
client_lifetime 2 minutes

# Logs go to a tmpfs (see README: --tmpfs /var/log/squid). Squid runs as the
# unprivileged "proxy" user from the start, so it cannot reopen the
# container's stdout; read logs with: docker exec egress cat /var/log/squid/access.log
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache_store_log none
pid_filename none
netdb_filename none
pinger_enable off
logfile_rotate 0
coredump_dir /tmp
